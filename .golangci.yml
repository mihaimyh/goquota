# golangci-lint v2 configuration for goquota project.
# See https://golangci-lint.run/docs/configuration/file/ for details.
#
# Scope: correctness, security and resource-safety. Purely cosmetic linters
# (revive doc-comments, goconst, lll, gocyclo, gocritic) are intentionally off
# so the gate stays meaningful without a large style-only churn.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    misspell:
      locale: US
    nolintlint:
      allow-unused: true
      require-explanation: false
      require-specific: false
  exclusions:
    paths:
      - vendor
      - examples
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
    rules:
      # Exclude some linters from test files
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - unparam
      # Exclude known false positives
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
        linters:
          - errcheck
      # Exclude gosec warnings for test files
      - path: _test\.go
        text: "G104"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mihaimyh/goquota
  exclusions:
    paths:
      - vendor
      - examples

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true
